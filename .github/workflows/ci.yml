name: CI — Lint, TypeCheck & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────
  # Job 1: Lint & Type Check
  # ──────────────────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Restore pnpm dependency cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @devlens/types build
          pnpm --filter @devlens/config build
          pnpm --filter @devlens/code-parser build

      - name: TypeScript type-check (API)
        run: pnpm --filter @devlens/api exec tsc --noEmit

      - name: TypeScript type-check (Web)
        run: pnpm --filter @devlens/web exec tsc --noEmit

  # ──────────────────────────────────────────────────────────
  # Job 2: Jest Unit & Integration Tests
  # ──────────────────────────────────────────────────────────
  test:
    name: Jest Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: devlens_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://testuser:testpass@localhost:5433/devlens_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-jwt-secret-key-32-chars-long
      COOKIE_SECRET: ci-test-cookie-secret-key
      OPENAI_API_KEY: mock
      GITHUB_CLIENT_ID: mock-github-client-id
      GITHUB_CLIENT_SECRET: mock-github-client-secret
      GITHUB_WEBHOOK_SECRET: mock-webhook-secret
      FRONTEND_URL: http://localhost:5173
      PORT: 3001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Restore pnpm dependency cache
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @devlens/types build
          pnpm --filter @devlens/config build
          pnpm --filter @devlens/code-parser build

      - name: Run Jest test suite
        run: pnpm --filter @devlens/api test -- --passWithNoTests --forceExit

      - name: Upload test coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jest-coverage
          path: apps/api/coverage/
          retention-days: 14
