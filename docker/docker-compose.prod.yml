name: devlens-ai-production

# ============================================================
# Production Docker Compose — DevLens AI
# Usage: docker compose -f docker/docker-compose.prod.yml up -d
# ============================================================

services:

  # ── PostgreSQL 16 + pgvector ──────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devlens-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - devlens_pgdata_prod:/var/lib/postgresql/data
    networks:
      - devlens_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # No external port exposure in production — internal network only
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Redis 7 ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: devlens-redis-prod
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    volumes:
      - devlens_redisdata_prod:/data
    networks:
      - devlens_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Express API Server ────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: devlens-api:${IMAGE_TAG:-latest}
    container_name: devlens-api-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      LOG_LEVEL: info
    networks:
      - devlens_internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # ── Nginx + React Web UI ──────────────────────────────────
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    image: devlens-web:${IMAGE_TAG:-latest}
    container_name: devlens-web-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - devlens_internal
    depends_on:
      api:
        condition: service_healthy
    volumes:
      # Mount Let's Encrypt SSL certificates
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - devlens_nginx_logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  devlens_pgdata_prod:
    driver: local
  devlens_redisdata_prod:
    driver: local
  devlens_nginx_logs:
    driver: local

networks:
  devlens_internal:
    driver: bridge
    internal: false
