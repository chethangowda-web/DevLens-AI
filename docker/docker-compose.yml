services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devlens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-devlens_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - devlens_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-devlens_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devlens-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - devlens_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  devlens_pgdata:
    driver: local
  devlens_redisdata:
    driver: local
